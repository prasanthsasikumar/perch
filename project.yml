name: MenuDo
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.0.0
targets:
  MenuDo:
    type: application
    platform: macOS
    sources:
      - MenuDo
      - path: MenuDo/Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.MenuDo
        CODE_SIGN_ENTITLEMENTS: MenuDo/MenuDo.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MenuDo/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuDo
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar"
    scheme:
      testTargets: [MenuDoTests]
  MenuDoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MenuDoTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MenuDo
