name: Perch
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.0.0
  PerchKit:
    path: PerchKit
  MenuDoPlugin:
    path: Plugins/MenuDoPlugin
  AnalyticsPlugin:
    path: Plugins/AnalyticsPlugin
targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - Perch
      - path: Perch/Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
      - package: PerchKit
        product: PerchKit
      - package: MenuDoPlugin
        product: MenuDoPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch
        CODE_SIGN_ENTITLEMENTS: Perch/Perch.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Perch/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar"
    scheme:
      testTargets: [PerchTests]
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PerchTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Perch
      - package: PerchKit
        product: PerchKit
      - package: MenuDoPlugin
        product: MenuDoPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
