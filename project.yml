name: Perch
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.0.0
  PerchKit:
    path: PerchKit
  MenuDoPlugin:
    path: Plugins/MenuDoPlugin
  AnalyticsPlugin:
    path: Plugins/AnalyticsPlugin
  MarketPlugin:
    path: Plugins/MarketPlugin
  BusyPlugin:
    path: Plugins/BusyPlugin
  ServerPlugin:
    path: Plugins/ServerPlugin
targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - Perch
      - Shared
      - path: PerchHelper/org.ahlab.Perch.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Perch/Resources
        buildPhase: resources
    dependencies:
      - target: PerchHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
      - package: PerchKit
        product: PerchKit
      - package: MenuDoPlugin
        product: MenuDoPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
      - package: MarketPlugin
        product: MarketPlugin
      - package: BusyPlugin
        product: BusyPlugin
      - package: ServerPlugin
        product: ServerPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch
        CODE_SIGN_ENTITLEMENTS: Perch/Perch.entitlements
        MARKETING_VERSION: "2.3.1"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug is signed with a real Development identity rather than ad hoc,
        # because an ad-hoc signature changes on every build — and the Keychain
        # trusts the exact binary that created an item, so Analytics' key
        # re-prompted after every rebuild. A stable identity makes "Always
        # Allow" stick.
        #
        # Hardened runtime is off here on purpose: XCTest injects a dylib into
        # the host app, which hardened runtime blocks. Xcode used to disable it
        # silently for ad-hoc signing; with a real identity it would not, and
        # the test suite would stop running.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_HARDENED_RUNTIME: NO
        # Release is what ships: Developer ID, hardened runtime on, ready to
        # notarize.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          # Notarization rejects a plain `xcodebuild build` twice over: Xcode
          # injects the debug get-task-allow entitlement, and signs without a
          # secure timestamp. Both are what `archive` would do on its own.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: Perch/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: "2.3.1"
        CFBundleVersion: "7"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar"
    scheme:
      testTargets: [PerchTests]
  # The root helper behind the keep-awake toggle. Registered with
  # SMAppService.daemon and run by launchd, never launched directly.
  PerchHelper:
    type: tool
    platform: macOS
    sources:
      - path: PerchHelper
        excludes:
          - "*.plist"
      - Shared
    settings:
      base:
        PRODUCT_NAME: PerchHelper
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch.helper
        SKIP_INSTALL: YES
        # A command-line tool is signed under its product name unless told
        # otherwise, and both ends of the XPC connection check this identifier.
        OTHER_CODE_SIGN_FLAGS: "--identifier org.ahlab.Perch.helper"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
        # Same rules as the app: notarization rejects get-task-allow and a
        # signature without a secure timestamp.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier org.ahlab.Perch.helper"
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PerchTests
      # The .html fixtures need to reach the test bundle; the plain directory
      # entry above picks up sources, not resources.
      - path: PerchTests/Plugins/Market/Fixtures
        buildPhase: resources
      - path: PerchTests/Plugins/Busy/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # The test bundle is injected into the host, so it has to be signed by
        # the same team the host is.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: Perch
      - package: PerchKit
        product: PerchKit
      - package: MenuDoPlugin
        product: MenuDoPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
      - package: MarketPlugin
        product: MarketPlugin
      - package: BusyPlugin
        product: BusyPlugin
      - package: ServerPlugin
        product: ServerPlugin
