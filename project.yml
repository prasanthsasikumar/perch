name: Perch
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.0.0
  PerchKit:
    path: PerchKit
  TasksPlugin:
    path: Plugins/TasksPlugin
  AnalyticsPlugin:
    path: Plugins/AnalyticsPlugin
  MarketPlugin:
    path: Plugins/MarketPlugin
  BusyPlugin:
    path: Plugins/BusyPlugin
  ServerPlugin:
    path: Plugins/ServerPlugin
  InternetPlugin:
    path: Plugins/InternetPlugin
  DownloadPlugin:
    path: Plugins/DownloadPlugin
  TapPlugin:
    path: Plugins/TapPlugin
  SpinPlugin:
    path: Plugins/SpinPlugin
targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - Perch
      - Shared
      - path: Perch/Resources
        buildPhase: resources
    dependencies:
      - target: PerchKeepAwake
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PerchTap
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
      - package: PerchKit
        product: PerchKit
      - package: TasksPlugin
        product: TasksPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
      - package: MarketPlugin
        product: MarketPlugin
      - package: BusyPlugin
        product: BusyPlugin
      - package: ServerPlugin
        product: ServerPlugin
      - package: InternetPlugin
        product: InternetPlugin
      - package: DownloadPlugin
        product: DownloadPlugin
      - package: TapPlugin
        product: TapPlugin
      - package: SpinPlugin
        product: SpinPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch
        CODE_SIGN_ENTITLEMENTS: Perch/Perch.entitlements
        MARKETING_VERSION: "2.7.0"
        CURRENT_PROJECT_VERSION: "11"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug is signed with a real Development identity rather than ad hoc,
        # because an ad-hoc signature changes on every build — and the Keychain
        # trusts the exact binary that created an item, so Analytics' key
        # re-prompted after every rebuild. A stable identity makes "Always
        # Allow" stick.
        #
        # Hardened runtime is off here on purpose: XCTest injects a dylib into
        # the host app, which hardened runtime blocks. Xcode used to disable it
        # silently for ad-hoc signing; with a real identity it would not, and
        # the test suite would stop running.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_HARDENED_RUNTIME: NO
        # Release is what ships: Developer ID, hardened runtime on, ready to
        # notarize.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          # Notarization rejects a plain `xcodebuild build` twice over: Xcode
          # injects the debug get-task-allow entitlement, and signs without a
          # secure timestamp. Both are what `archive` would do on its own.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: Perch/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: "2.7.0"
        CFBundleVersion: "11"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar"
        NSAppleEventsUsageDescription: "Spin reads the current track and its album art from Spotify and Music to draw them on your desktop."
    scheme:
      testTargets: [PerchTests]
  # Registers the root helper, then quits. Perch cannot do this itself: it is
  # sandboxed, and the sandbox denies job-creation. This app is deliberately
  # not sandboxed, and owns the helper and its launchd job.
  PerchKeepAwake:
    type: application
    platform: macOS
    sources:
      - path: PerchKeepAwake
      - Shared
      - path: PerchHelper/org.ahlab.Perch.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: PerchHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: PerchKeepAwake
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch.keepawake
        MARKETING_VERSION: "2.7.0"
        CURRENT_PROJECT_VERSION: "11"
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: PerchKeepAwake/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Perch Keep Awake
        CFBundleShortVersionString: "2.7.0"
        CFBundleVersion: "11"
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar"
  # The Tap plugin's engine: reads the motion sensor, classifies knocks and
  # runs what they map to. Not sandboxed — waking the sensor, typing into
  # other apps and running the user's shell commands are all things the
  # sandbox refuses (TapLink in TapKit has the details). Perch starts it while
  # the plugin is on, and it quits when Perch does.
  PerchTap:
    type: application
    platform: macOS
    sources:
      - path: PerchTap
        excludes:
          - "*.entitlements"
    dependencies:
      - package: TapPlugin
        product: TapKit
    settings:
      base:
        PRODUCT_NAME: PerchTap
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch.tap
        CODE_SIGN_ENTITLEMENTS: PerchTap/PerchTap.entitlements
        MARKETING_VERSION: "2.7.0"
        CURRENT_PROJECT_VERSION: "11"
        SKIP_INSTALL: YES
      configs:
        # Signed with the same stable identity as Perch, for the same reason:
        # Accessibility is granted to an exact signature, and an ad-hoc one
        # changes on every build.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: PerchTap/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Perch Tap
        CFBundleShortVersionString: "2.7.0"
        CFBundleVersion: "11"
        NSHumanReadableCopyright: "© 2026 Prasanth Sasikumar. Knock detection ported from MacTap, © 2026 Jaskirat Singh, MIT License."
        NSAccessibilityUsageDescription: "Perch Tap sends the keyboard shortcut or media key a knock is mapped to."
        NSAppleEventsUsageDescription: "Perch Tap asks System Events to type the shortcut a knock is mapped to, and runs your AppleScript actions."
        NSInputMonitoringUsageDescription: "Perch Tap can notice typing so knocks are ignored while you type. Optional — Accessibility already covers this."
        NSMotionUsageDescription: "Perch Tap reads the MacBook's built-in motion sensor to feel knocks on the chassis."
  # The root helper behind the keep-awake toggle. Registered with
  # SMAppService.daemon by PerchKeepAwake and run by launchd, never launched directly.
  PerchHelper:
    type: tool
    platform: macOS
    sources:
      - path: PerchHelper
        excludes:
          - "*.plist"
      - Shared
    settings:
      base:
        PRODUCT_NAME: PerchHelper
        PRODUCT_BUNDLE_IDENTIFIER: org.ahlab.Perch.helper
        SKIP_INSTALL: YES
        # A command-line tool is signed under its product name unless told
        # otherwise, and both ends of the XPC connection check this identifier.
        OTHER_CODE_SIGN_FLAGS: "--identifier org.ahlab.Perch.helper"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
        # Same rules as the app: notarization rejects get-task-allow and a
        # signature without a secure timestamp.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: FLOWXR PTE. LTD. (3U4384584Z)"
          DEVELOPMENT_TEAM: 3U4384584Z
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier org.ahlab.Perch.helper"
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PerchTests
      # The .html fixtures need to reach the test bundle; the plain directory
      # entry above picks up sources, not resources.
      - path: PerchTests/Plugins/Market/Fixtures
        buildPhase: resources
      - path: PerchTests/Plugins/Busy/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # The test bundle is injected into the host, so it has to be signed by
        # the same team the host is.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Prasanth Sasikumar (5AD8QG2238)"
          DEVELOPMENT_TEAM: 3U4384584Z
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: Perch
      - package: PerchKit
        product: PerchKit
      - package: TasksPlugin
        product: TasksPlugin
      - package: AnalyticsPlugin
        product: AnalyticsPlugin
      - package: MarketPlugin
        product: MarketPlugin
      - package: BusyPlugin
        product: BusyPlugin
      - package: ServerPlugin
        product: ServerPlugin
      - package: InternetPlugin
        product: InternetPlugin
      - package: DownloadPlugin
        product: DownloadPlugin
      - package: TapPlugin
        product: TapPlugin
      - package: SpinPlugin
        product: SpinPlugin
