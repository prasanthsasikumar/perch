    struck-through earlier price; the third real card is the one whose id
    repeats further down, as Facebook does when you scroll.
  -->

  </div>

      <div>
        <div><span><div><span dir="auto">₹276,000</span></div></span></div>
        <div><span aria-hidden="true"><div><span dir="auto">Interceptor 650</span></div></span></div>
        <div><span aria-hidden="true"><div><span dir="auto"><span>Kochi, KL</span></span></div></span></div>
      </div></div>

      <div>
        <div><span><div><span dir="auto">₹250,000</span><span dir="auto"><s>₹270,000</s></span></div></span></div>

        <div><span aria-hidden="true"><div><span dir="auto"><span>Palakkad, KL</span></span></div></span></div>
